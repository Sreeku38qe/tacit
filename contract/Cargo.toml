[package]
name = "tacit"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Silence procedure for Sputnik DAO budgets: a spend passes unless someone objects in time."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `legacy` provides the write-through collections, so env::storage_usage() is exact when charging a budget.
near-sdk = { version = "5.30", features = ["legacy"] }
tacit-logic = { path = "logic" }

[workspace]
members = ["logic"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
